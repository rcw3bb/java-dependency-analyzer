[loggers]
keys=root,httpx

[handlers]
keys=fileHandler

[formatters]
keys=logFormatter

[logger_root]
level=INFO
handlers=fileHandler

[logger_httpx]
level=WARNING
handlers=
qualname=httpx
propagate=1

[handler_fileHandler]
class=FileHandler
formatter=logFormatter
args=('java_dependency_analyzer.log', 'a')

[formatter_logFormatter]
format=%(asctime)s [%(levelname)s] %(name)s - %(message)s
